<div class="confirm-container">
          <button class="edit-btn" (click)="goBack()">
          Edit Info
        </button>

  <div class="confirm-content">

    <!-- LEFT SIDE -->
    <div class="confirm-left">

      <!-- SELFIE -->
      <div class="selfie-wrapper">
        <img src="https://www.shutterstock.com/image-photo/portrait-indian-male-stylish-hairstyle-260nw-2433953885.jpg" alt="selfie">
      </div>

      <p class="verify-text">Identity Verified</p>

    </div>

    <!-- RIGHT SIDE -->
    <div class="confirm-right">

      <div class="form-wrapper">

        <!-- EDIT BUTTON TOP RIGHT -->


        <h2>Confirm Your Details</h2>
        <p class="subtitle">Please review your information before proceeding</p>

        <div class="info-card">

          <div class="info-row">
            <span>Name</span>
            <strong>{{ kycInfo.name }}</strong>
          </div>

          <div class="info-row">
            <span>D.O.B</span>
            <strong>{{ kycInfo.dateOfBirth }}</strong>
          </div>

          <div class="info-row">
            <span>Email</span>
            <strong>{{ basicInvestorInfo.email }}</strong>
          </div>

          <div class="info-row">
            <span>Phone</span>
            <strong>{{ basicInvestorInfo.phoneNumber }}</strong>
          </div>

          <div class="info-row">
            <span>Document</span>
            <strong class="verified">Uploaded ✔</strong>
          </div>

        </div>

      </div>

      <!-- BUTTON OUTSIDE CARD -->
      <div class="button-wrapper">
        <button class="submit-btn" (click)="goToDashboard()">
          Confirm & Continue
        </button>
      </div>

    </div>

  </div>

</div>
