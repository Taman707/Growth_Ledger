<div class="confirm-container">

  <div class="confirm-content">

    <!-- LEFT SIDE -->
    <div class="confirm-left">

      <!-- EDIT BUTTON (TOP LEFT) -->
      <button class="edit-btn">
        <mat-icon>arrow_back</mat-icon> Edit Info
      </button>

      <!-- SELFIE -->
      <div class="selfie-wrapper">
        <img src="https://via.placeholder.com/150" alt="selfie">
      </div>

      <p class="verify-text">Identity Verified</p>

    </div>

    <!-- RIGHT SIDE -->
    <div class="confirm-right">

      <div class="form-wrapper">

        <h2>Confirm Your Details</h2>
        <p class="subtitle">Please review your information before proceeding</p>

        <div class="info-card">

          <div class="info-row">
            <span>Name</span>
            <strong>{{ basicInvestorInfo?.fullName }}</strong>
          </div>

          <div class="info-row">
            <span>D.O.B</span>
            <strong>{{ kycInfo?.dateOfBirth }}</strong>
          </div>

          <div class="info-row">
            <span>Email</span>
            <strong>{{ basicInvestorInfo?.email }}</strong>
          </div>

          <div class="info-row">
            <span>Phone</span>
            <strong>{{ basicInvestorInfo?.phoneNumber }}</strong>
          </div>

          <div class="info-row">
            <span>Document</span>
            <strong class="verified">Uploaded ✔</strong>
          </div>

        </div>

        <!-- ACTION BUTTON -->
        <button class="submit-btn">
          Confirm & Continue
        </button>

      </div>

    </div>

  </div>

</div>
