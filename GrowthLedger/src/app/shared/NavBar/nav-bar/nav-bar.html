<!-- nav-bar.html -->
<nav class="navbar">

  <!-- LEFT LOGO -->
  <div class="logo" routerLink="/business/dashboard">
    GrowthLedger
  </div>

  <!-- MOBILE MENU BUTTON -->
  <button class="menu-btn" (click)="toggleMenu()">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- NAV CONTENT -->
  <div class="nav-wrapper" [class.active]="menuOpen">

    <!-- CENTER LINKS -->
    <ul class="nav-links">
      <li><a routerLink="/business/home" (click)="closeMenu()">Home</a></li>
      <li><a routerLink="/business/ledgerbook" (click)="closeMenu()">LedgerBook</a></li>
      <li><a routerLink="/business/dashboard" (click)="closeMenu()">Dashboard</a></li>
      <li><a routerLink="/about" (click)="closeMenu()">About Us</a></li>
    </ul>

    <!-- RIGHT SIDE -->
    <div class="right-section">

      <!-- DYNAMIC CTA BUTTON -->
      <button class="cta-btn" (click)="handleCTA()">
        {{ kycDone ? 'Interested Investors' : 'Complete KYC' }}
      </button>

      <!-- NOTIFICATION -->
      <button class="icon-btn">
        <mat-icon>notifications</mat-icon>
        <span class="dot"></span>
      </button>

      <!-- PROFILE -->
      <button class="profile-btn">
        <mat-icon>account_circle</mat-icon>
      </button>

    </div>

  </div>

</nav>
